# Shared Hermes Discord config template — copy into each profile as config.yaml
# Secrets stay in .env (DISCORD_BOT_TOKEN). Do not commit real tokens.

discord:
  require_mention: true
  auto_thread: true
  history_backfill: true
  history_backfill_limit: 50
  reactions: true
  # free_response_channels: "STANDUP_CHANNEL_ID"  # CEO만 standup에 설정 권장

platform_toolsets:
  discord: [hermes-discord]
  # telegram: [hermes-telegram]  # DM 핫라인만 쓸 때 활성화

# Model: REQUIRED for the bot to answer (the Discord token only connects it).
# hermes 0.19.0 expects a FLAT string here (measured: DEFAULT_CONFIG has `"model": ""`),
# not a nested `model.default`. Don't hand-write it — run the wizard once per profile:
#   hermes -p <name> model
# It stores the provider + model in this file for you. API keys go in .env
# (ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY / XAI_API_KEY — measured list).
