name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate company.discord.json (SSoT)
        run: python3 scripts/companyctl.py validate

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Markdown links
        run: python3 scripts/check_links.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker-compose spec
        run: |
          # Token files are gitignored; compose needs them to resolve env_file.
          for p in ceo cto loop growth critic; do
            echo "DISCORD_BOT_TOKEN=ci-placeholder" > "secrets/$p.env"
          done
          docker compose config >/dev/null
          rm -f secrets/*.env
