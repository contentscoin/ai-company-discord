name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate company.discord.json (SSoT)
        run: python3 scripts/companyctl.py validate

      - name: Check Markdown links
        run: python3 scripts/check_links.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh
