name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Portability is not uniform: the config/protocol commands must work on all
  # three platforms, the gateway lifecycle is POSIX-only by design. Running the
  # suite on Windows is what keeps that distinction honest instead of a claim.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate company.discord.json (SSoT)
        run: python3 scripts/companyctl.py validate

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Markdown links
        run: python3 scripts/check_links.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker-compose spec
        run: |
          # Token files are gitignored; compose needs them to resolve env_file.
          for p in ceo cto loop growth critic; do
            echo "DISCORD_BOT_TOKEN=ci-placeholder" > "secrets/$p.env"
          done
          docker compose config >/dev/null
          rm -f secrets/*.env
